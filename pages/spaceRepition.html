                    <button class="btn-show" onclick="showAnswer()">Show</button>

                <div class="feedback" id="feedback"></div>

            </div>
            <div class="button-group">

                <button class="btn-submit" onclick="backQuestion()" style="background: #9c27b0;">Back</button>

            const inputElement = document.getElementById('answer-input');
