<!DOCTYPE html>
<html lang="est">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estonian Quiz 7: tõlkige!</title>
    <script src="progress-tracker.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex; /* Enable flexbox for side navigation */
        }
        #nav-container {
            width: 180px;
            padding: 15px;
            margin-right: 30px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f0f8ff; 
            height: fit-content;
        }
        #nav-container h2 {
            margin-top: 0;
            font-size: 1.2em;
        }
        #nav-container ul {
            list-style: none;
            padding: 0;
        }
        #nav-container a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            display: block;
            padding: 5px 0;
        }
        #quiz-container {
            flex-grow: 1; /* Allows quiz content to take up remaining space */
            max-width: 600px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
            text-align: left;
        }
        .question-item {
            margin-bottom: 20px;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .statement {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input[type="text"] {
            padding: 8px;
            width: 70%;
            margin-right: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .answer-feedback {
            font-weight: bold;
            display: inline-block;
            margin-left: 10px;
        }
        .correct {
            color: green;
        }
        .incorrect {
            color: red;
        }
        #check-all-button {
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1em;
            background-color: #007bff;
            color: white;
            margin-top: 20px;
            width: 100%;
        }
        #overall-feedback {
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div id="nav-container">
        <h2>Navigatsioon</h2>
        <ul>
            <li><a href="quiz1.html">Quiz 1: form I II III</a></li>
            <li><a href="quiz2.html">Quiz 2: -L -S</a></li>
            <li><a href="quiz3.html">Quiz 3: -LE -SSE</a></li>
            <li><a href="quiz4.html">Quiz 4: -LT -ST</a></li>
            <li><a href="quiz5.html">Quiz 5: -GA -TA</a></li>
            <li><a href="quiz6.html">Quiz 6: -NA -KS -NI</a></li>
            <li><a href="quiz7.html" style="color: #0056b3;">Quiz 7: tõlkige!</a></li>
            <li><a href="quiz8.html">Quiz 8</a></li>
            <li><a href="quiz9.html">Quiz 9</a></li>
            <li><a href="quiz10.html">Quiz 10</a></li>
        </ul>
    </div>

    <div id="quiz-container">
        <h1>Quiz 7 Tõlkige!</h1>
        <div style="display: flex; gap: 15px; margin-bottom: 15px;">
            <a href="quizzes.html" style="padding: 8px 16px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">← Tagasi Kvizzidele</a>
            <a href="progress.html" style="padding: 8px 16px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">📅 Vaata oma edenemist</a>
        </div>

        <div id="questions-list">
            </div>

        <button id="check-all-button" onclick="checkAllAnswers()">Kontrolli Vastuseid (Check All Answers)</button>
        
        <p id="overall-feedback"></p>
    </div>

    <script>
        // Array of objects containing the statement (Q) and the correct question (A)
        const quizData = [
            { statement: "How many weeks do you take off?(sg.)", question: "Mitu nädalat sa puhkad?" },
            { statement: "Write it by Monday.(sg.)", question: "Kirjuta esmaspäevaks." },
            { statement: "Who does your husband work as?(sg.)", question: "Kellena sinu mees töötab?" },
            { statement: "I go to a workout once a week.", question: "Ma käin trennis üks kord nädalas." },
            { statement: "Where will we meet.", question: "Kus me kohtume kokku?" },

            { statement: "To whose place will you go tommorow?(pl.)", question: "Kelle juurde te homme lähete?" },
            { statement: "Can I pay by card?)", question: "Kas kaardiga saab maksta?" },
            { statement: "My daughter will go to London for a month.", question: "Minu tütar sõidab kuuks Londonisse." },
            { statement: "What will you have a sandwich with sausage or ham?(sg.)", question: "Mida sa soovid, kas võileiba vorstiga või singiga?" },
            { statement: "Are you going to the birthday by car?(pl.)", question: "Kas sa sõidad sünnipäevale autoga?" }
        ];

        /**
         * Generates the HTML to display all questions and input fields.
         */
        function loadAllQuestions() {
            const listContainer = document.getElementById('questions-list');
            let htmlContent = '';

            // Using the for...of loop to iterate over the array elements
            for (const [index, item] of quizData.entries()) {
                htmlContent += `
                    <div class="question-item">
                        <div class="statement">
                            ${index + 1}. VÄIDE (Statement): ${item.statement}
                        </div>
                        <label for="q-${index}">Translate in Estonian:</label>
                        <input type="text" id="q-${index}" placeholder="Kirjuta küsimus siia">
                        <span class="answer-feedback" id="feedback-${index}"></span>
                    </div>
                `;
            }

            listContainer.innerHTML = htmlContent;
        }

        /**
         * Checks all user inputs against the correct answers and displays feedback and score.
         */
        function checkAllAnswers() {
            let correctCount = 0;
            const totalQuestions = quizData.length;

            for (let i = 0; i < totalQuestions; i++) {
                const userInput = document.getElementById(`q-${i}`).value.trim();
                const correctQuestion = quizData[i].question.trim();
                const feedbackElement = document.getElementById(`feedback-${i}`);

                // Normalize the correct answer for checking (remove question marks, comma, ensure case-insensitivity)
                const normalizedCorrect = correctQuestion.toLowerCase().replace(/[?,]/g, '').trim();
                const normalizedInput = userInput.toLowerCase().replace(/[?,]/g, '').trim();

                feedbackElement.classList.remove('correct', 'incorrect');

                if (normalizedInput === normalizedCorrect) {
                    feedbackElement.classList.add('correct');
                    feedbackElement.innerHTML = `✅ Õige! (${correctQuestion})`;
                    correctCount++;
                } else {
                    feedbackElement.classList.add('incorrect');
                    feedbackElement.innerHTML = `❌ Vale. Õige: <span style="font-weight: bold;">${correctQuestion}</span>`;
                }
            }

            // --- SCORE DISPLAY ---
            const overallFeedback = document.getElementById('overall-feedback');
            
            const percentage = Math.round((correctCount / totalQuestions) * 100);
            
            overallFeedback.innerHTML = `Sinu skoor: **${correctCount} / ${totalQuestions}** (${percentage}%)`;
            
            if (correctCount === totalQuestions) {
                overallFeedback.style.color = 'green';
                overallFeedback.textContent += ' Fantastiline! 🎉';
            } else if (correctCount > totalQuestions / 2) {
                overallFeedback.style.color = 'darkorange';
                overallFeedback.textContent += ' Hea töö! Jätka harjutamist. 👍';
            } else {
                overallFeedback.style.color = 'red';
                overallFeedback.textContent += ' Proovi uuesti! 🤔';
            }
            overallFeedback.scrollIntoView({ behavior: 'smooth' });

            // Save score to database
            saveQuizScore(7, correctCount, totalQuestions);
        }

        // Initialize the quiz when the page loads
        window.onload = loadAllQuestions;
    </script>

</body>
</html>
