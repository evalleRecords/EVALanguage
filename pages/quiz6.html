<!DOCTYPE html>
<html lang="est">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estonian Quiz 6: -NA -KS -NI (Kellena?Kelleks?Milleni? Kui kauaks?Mis päevaks?Mis Kellani? Mis päevani?</title>
    <script src="progress-tracker.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #quiz-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
            text-align: left;
        }
        .question-item {
            margin-bottom: 20px;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .statement {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input[type="text"] {
            padding: 8px;
            width: 70%;
            margin-right: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .answer-feedback {
            font-weight: bold;
            display: inline-block;
            margin-left: 10px;
        }
        .correct {
            color: green;
        }
        .incorrect {
            color: red;
        }
        #check-all-button {
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1em;
            background-color: #007bff;
            color: white;
            margin-top: 20px;
            width: 100%;
        }
        #overall-feedback {
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div id="quiz-container">
        <h1>Quiz 6 (Kõik Küsimused) 🇪🇪</h1>
        <p>Sinu ülesanne on kirjutada **õige küsimus** antud vastuse (väite) põhjal.</p>
        <p>Teema: -NA -KS -NI (Kellena?Kelleks?Milleni? Kui kauaks?Mis päevaks?Mis Kellani? Mis päevani?</p>
        <div style="display: flex; gap: 15px; margin-bottom: 15px;">
            <a href="quizzes.html" style="padding: 8px 16px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">← Tagasi Kvizzidele</a>
            <a href="progress.html" style="padding: 8px 16px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">📅 Vaata oma edenemist</a>
        </div>

        <div id="questions-list">
            </div>

        <button id="check-all-button" onclick="checkAllAnswers()">Kontrolli Vastuseid (Check All Answers)</button>
        
        <p id="overall-feedback"></p>
    </div>

    <script>
        // Array of objects containing the statement (Q) and the correct question (A)
        const quizData = [
            { statement: "Ta tahab saada (müüjaks).", question: "Kelleks ta tahab saada?" },
            { statement: "Me ootame (kella viieni).", question: "Mis kellani te ootate?" },
            { statement: "Nad puhkavad (neljapäevani).", question: "Mis päevani nad puhkavad?" },
            { statement: "Minu poeg töötab (autojuhina) ja tütar (ettekandjana).", question: "Kellena töötavad sinu poeg ja tütar?" },
            { statement: "(Teatrini) on 5 peatust.", question: "Milleni on 5 peatust?" }
        ];

        /**
         * Generates the HTML to display all questions and input fields.
         */
        function loadAllQuestions() {
            const listContainer = document.getElementById('questions-list');
            let htmlContent = '';

            // Using the for...of loop to iterate over the array elements
            for (const [index, item] of quizData.entries()) {
                htmlContent += `
                    <div class="question-item">
                        <div class="statement">
                            ${index + 1}. VÄIDE (Statement): ${item.statement}
                        </div>
                        <label for="q-${index}">Sinu Küsimus:</label>
                        <input type="text" id="q-${index}" placeholder="Kirjuta küsimus siia">
                        <span class="answer-feedback" id="feedback-${index}"></span>
                    </div>
                `;
            }

            listContainer.innerHTML = htmlContent;
        }

        /**
         * Checks all user inputs against the correct answers and displays feedback and score.
         */
        function checkAllAnswers() {
            let correctCount = 0;
            const totalQuestions = quizData.length;

            for (let i = 0; i < totalQuestions; i++) {
                const userInput = document.getElementById(`q-${i}`).value.trim();
                const correctQuestion = quizData[i].question.trim();
                const feedbackElement = document.getElementById(`feedback-${i}`);

                // Normalize the correct answer for checking (remove question marks, comma, ensure case-insensitivity)
                const normalizedCorrect = correctQuestion.toLowerCase().replace(/[?,]/g, '').trim();
                const normalizedInput = userInput.toLowerCase().replace(/[?,]/g, '').trim();

                feedbackElement.classList.remove('correct', 'incorrect');

                if (normalizedInput === normalizedCorrect) {
                    feedbackElement.classList.add('correct');
                    feedbackElement.innerHTML = `✅ Õige! (${correctQuestion})`;
                    correctCount++;
                } else {
                    feedbackElement.classList.add('incorrect');
                    feedbackElement.innerHTML = `❌ Vale. Õige: <span style="font-weight: bold;">${correctQuestion}</span>`;
                }
            }

            // --- SCORE DISPLAY ---
            const overallFeedback = document.getElementById('overall-feedback');
            
            const percentage = Math.round((correctCount / totalQuestions) * 100);
            
            overallFeedback.innerHTML = `Sinu skoor: **${correctCount} / ${totalQuestions}** (${percentage}%)`;
            
            if (correctCount === totalQuestions) {
                overallFeedback.style.color = 'green';
                overallFeedback.textContent += ' Fantastiline! 🎉';
            } else if (correctCount > totalQuestions / 2) {
                overallFeedback.style.color = 'darkorange';
                overallFeedback.textContent += ' Hea töö! Jätka harjutamist. 👍';
            } else {
                overallFeedback.style.color = 'red';
                overallFeedback.textContent += ' Proovi uuesti! 🤔';
            }
            overallFeedback.scrollIntoView({ behavior: 'smooth' });

            // Save score to database
            saveQuizScore(6, correctCount, totalQuestions);
        }

        // Initialize the quiz when the page loads
        window.onload = loadAllQuestions;
    </script>

</body>
</html>
