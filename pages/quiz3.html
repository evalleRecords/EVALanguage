<!DOCTYPE html>
<html lang="est">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estonian Quiz 3: Case Endings (-LE, -SSE) (Kuhu?, Kellele?)</title>
    <script src="progress-tracker.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #quiz-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px; 
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
            text-align: left;
        }
        .question-item {
            margin-bottom: 15px;
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex; 
            align-items: center; 
            flex-wrap: nowrap; 
        }
        
        /* This wrapper ensures the text and input stay together */
        .statement-input-wrapper {
            display: contents; 
            white-space: nowrap; 
            line-height: 1.6; 
        }
        
        .base-word {
            color: gray;
            font-size: 0.9em;
            /* Key change: Pushes the element to the far right */
            margin-left: auto; 
            flex-shrink: 0; 
            padding-left: 15px; /* Add some space between feedback and base word */
        }
        input[type="text"] {
            padding: 6px 8px; 
            width: 120px; 
            border: 1px solid #ddd;
            border-radius: 4px;
            margin: 0 5px;
            text-align: center;
            font-size: 1em;
            flex-shrink: 0;
        }
        .answer-feedback {
            font-weight: bold;
            margin-left: 10px;
            flex-shrink: 0; /* Prevent feedback from shrinking */
        }
        .correct {
            color: green;
        }
        .incorrect {
            color: red;
        }
        #check-all-button {
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1em;
            background-color: #007bff;
            color: white;
            margin-top: 20px;
            width: 100%;
        }
        #overall-feedback {
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div id="quiz-container">
        <h1>Quiz 3: Täida Lüngad (Fill in the Blanks) 🇪🇪</h1>
        <p>Sinu ülesanne on kirjutada sulgudes olevale tüvisõnale **õige kääne**.</p>
        <p>Teema: (-LE, -SSE) (Kuhu?, Kellele?)</p>
        <div style="display: flex; gap: 15px; margin-bottom: 15px;">
            <a href="quizzes.html" style="padding: 8px 16px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">← Tagasi Kvizzidele</a>
            <a href="progress.html" style="padding: 8px 16px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">📅 Vaata oma edenemist</a>
        </div>

        <div id="questions-list">
            </div>

        <button id="check-all-button" onclick="checkAllAnswers()">Kontrolli Vastuseid (Check All Answers)</button>
        
        <p id="overall-feedback"></p>
    </div>

    <script>
        // Data structure remains the same
        const quizData = [
            { id: 1, base: "to the store", before: "Millal te ", answer: "poodi", after: " lähete?" },
            { id: 2, base: "to the market", before: "Ülo läheb puhkepäeviti kell 7.30", answer: "turule", after: "." },
            { id: 3, base: "you", before: "See ei sobi ", answer: "sulle", after: "üldse" },
            { id: 4, base: "whom", before: " ", answer: "kellele", after: "sa praegu helistad?" },
            { id: 5, base: "to the neighbor", before: "Ma räägin homme ", answer: "nabrile", after: "." },
            { id: 6, base: "where", before: " ", answer: "kuhu", after: "te laupäeval lähete?" },
            { id: 7, base: "to work", before: "Mina lähen kell 8.00 ", answer: "tööle", after: "." },
            { id: 8, base: "to the doctor", before: "Mis kell sa ", answer: "arsti juurde", after: " lähed?" },
            { id: 9, base: "to the theatre", before: "Nad ei lähe reedel ", answer: "teatrisse", after: "." },
            { id: 10, base: "you", before: "Me helistame ", answer: "teile", after: "tagasi." }
        ];

        /**
         * Generates the HTML to display all questions and input fields.
         */
        function loadAllQuestions() {
            const listContainer = document.getElementById('questions-list');
            let htmlContent = '';

            for (const item of quizData) {
                const inputId = `q-${item.id}`;
                
                htmlContent += `
                    <div class="question-item">
                        <span class="statement-input-wrapper">
                            ${item.id}. 
                            ${item.before}
                        </span>
                        <input type="text" id="${inputId}" placeholder="Õige vorm">
                        <span class="statement-input-wrapper">
                            ${item.after}
                        </span>
                        <span class="answer-feedback" id="feedback-${item.id}"></span>
                        <span class="base-word">(${item.base})</span> 
                    </div>
                `;
            }

            listContainer.innerHTML = htmlContent;
        }

        /**
         * Checks all user inputs against the correct answers and displays feedback and score.
         */
        function checkAllAnswers() {
            let correctCount = 0;
            const totalQuestions = quizData.length;

            quizData.forEach(item => {
                const inputId = `q-${item.id}`;
                const userInput = document.getElementById(inputId).value.trim();
                const feedbackId = `feedback-${item.id}`;
                const feedbackElement = document.getElementById(feedbackId);

                const normalizedCorrect = item.answer.toLowerCase().replace(/[?,.]/g, '').trim();
                const normalizedInput = userInput.toLowerCase().replace(/[?,.]/g, '').trim();

                feedbackElement.classList.remove('correct', 'incorrect');
                
                if (normalizedInput === normalizedCorrect) {
                    feedbackElement.classList.add('correct');
                    feedbackElement.innerHTML = `✅ Õige!`;
                    correctCount++;
                } else {
                    feedbackElement.classList.add('incorrect');
                    feedbackElement.innerHTML = `❌ Vale. Õige: <span class="correct-word">${item.answer}</span>`;
                }
            });

            // --- SCORE DISPLAY ---
            const overallFeedback = document.getElementById('overall-feedback');
            
            const percentage = Math.round((correctCount / totalQuestions) * 100);
            
            overallFeedback.innerHTML = `Sinu skoor: **${correctCount} / ${totalQuestions}** (${percentage}%)`;
            
            if (correctCount === totalQuestions) {
                overallFeedback.style.color = 'green';
                overallFeedback.textContent += ' Fantastiline! 🎉';
            } else if (correctCount > totalQuestions / 2) {
                overallFeedback.style.color = 'darkorange';
                overallFeedback.textContent += ' Hea töö! Jätka harjutamist. 👍';
            } else {
                overallFeedback.style.color = 'red';
                overallFeedback.textContent += ' Proovi uuesti! 🤔';
            }
            overallFeedback.scrollIntoView({ behavior: 'smooth' });

            // Save score to database
            saveQuizScore(3, correctCount, totalQuestions);
        }

        // Initialize the quiz when the page loads
        window.onload = loadAllQuestions;
    </script>

</body>
</html>
